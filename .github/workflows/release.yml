name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-run-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  validate:
    name: Validate Tag Ref
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate tag format and version match
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Release workflow must be run on a version tag ref starting with 'v' (e.g. refs/tags/v1.0.0)"
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF#refs/tags/v}"

          PKG_VERSION=$(jq -r .version package.json)

          TAURI_VERSION=$(jq -r .version src-tauri/tauri.conf.json)

          CARGO_VERSION=$(grep -m 1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f 2)

          echo "Tag version: $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"
          echo "tauri.conf.json version: $TAURI_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"

          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$TAURI_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match tauri.conf.json version ($TAURI_VERSION)"
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match src-tauri/Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

  quality:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      release: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    name: Publish verified installers
    needs: [validate, quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v6
        with:
          pattern: tauri-*
          path: release-assets
          merge-multiple: true
      - name: Verify build identities, checksums and updater signatures
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { copyFileSync, existsSync, mkdirSync, readFileSync, statSync, writeFileSync } from 'node:fs';
          import { basename, join } from 'node:path';
          const platforms = ['darwin-aarch64', 'darwin-x86_64', 'linux-x86_64', 'windows-x86_64'];
          const sha256 = (path) => createHash('sha256').update(readFileSync(path)).digest('hex');
          const safeName = (name) =>
            typeof name === 'string' &&
            basename(name) === name &&
            !/[\\/]/.test(name) &&
            !['.', '..'].includes(name);
          const updaterFile = (platform, files) => {
            const suffixes = platform.startsWith('darwin')
              ? ['.app.tar.gz']
              : platform.startsWith('linux')
                ? ['.AppImage', '.AppImage.tar.gz']
                : ['.msi.zip', '.msi', '.nsis.zip', '.exe'];
            return suffixes.map((suffix) => files.find((file) => file.name.endsWith(suffix))).find(Boolean);
          };

          function prepare({
            directory,
            version,
            commit,
            repository,
            notes = '',
            date = new Date().toISOString(),
          }) {
            const manifests = platforms.map((platform) =>
              JSON.parse(readFileSync(join(directory, `manifest-${platform}.json`), 'utf8')),
            );
            const seen = new Set();
            for (const manifest of manifests) {
              if (
                !platforms.includes(manifest.platform) ||
                seen.has(manifest.platform) ||
                manifest.version !== version ||
                manifest.commit !== commit
              )
                throw new Error('Artifact version, commit or platform mismatch');
              seen.add(manifest.platform);
              for (const file of manifest.files) {
                if (!safeName(file.name) || sha256(join(directory, file.name)) !== file.sha256)
                  throw new Error(`Invalid artifact: ${file.name}`);
              }
            }
            if (manifests.some((m) => m.signed) && !manifests.every((m) => m.signed))
              throw new Error('Mixed signed and unsigned installers');
            const published = manifests.flatMap((m) => m.files.map((file) => file.name));
            if (new Set(published).size !== published.length) throw new Error('Colliding installer names');
            if (manifests.every((m) => m.signed)) {
              const feed = { version, notes, pub_date: date, platforms: {} };
              for (const manifest of manifests) {
                const file = updaterFile(manifest.platform, manifest.files);
                if (!file || !manifest.files.some((f) => f.name === `${file.name}.sig`))
                  throw new Error('Updater signature missing');
                const signature = readFileSync(join(directory, `${file.name}.sig`), 'utf8').trim();
                if (!signature) throw new Error('Empty updater signature');
                feed.platforms[manifest.platform] = {
                  signature,
                  url: `https://github.com/${repository}/releases/download/v${version}/${encodeURIComponent(file.name)}`,
                };
                for (const candidate of manifest.files) {
                  if (!manifest.files.some((entry) => entry.name === `${candidate.name}.sig`)) continue;
                  const bundle = candidate.name.endsWith('.app.tar.gz')
                    ? 'app'
                    : /\.AppImage(?:\.tar\.gz)?$/.test(candidate.name)
                      ? 'appimage'
                      : /\.msi(?:\.zip)?$/.test(candidate.name)
                        ? 'msi'
                        : /(?:\.exe|\.nsis\.zip)$/.test(candidate.name)
                          ? 'nsis'
                          : null;
                  if (!bundle) continue;
                  const scopedSignature = readFileSync(
                    join(directory, `${candidate.name}.sig`),
                    'utf8',
                  ).trim();
                  if (!scopedSignature) throw new Error('Empty updater signature');
                  feed.platforms[`${manifest.platform}-${bundle}`] = {
                    signature: scopedSignature,
                    url: `https://github.com/${repository}/releases/download/v${version}/${encodeURIComponent(candidate.name)}`,
                  };
                }
              }
              writeFileSync(join(directory, 'latest.json'), `${JSON.stringify(feed, null, 2)}\n`);
              published.push('latest.json');
            }
            writeFileSync(
              join(directory, 'SHA256SUMS'),
              `${published
                .sort()
                .map((name) => `${sha256(join(directory, name))}  ${name}`)
                .join('\n')}\n`,
            );
            return published;
          }

          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          if (
            process.env.GITHUB_REF_NAME !== `v${version}` ||
            JSON.parse(readFileSync('package.json')).version !== version
          )
            throw new Error('Tag/version mismatch');
          const lines = readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const start = lines.findIndex(
            (line) => line === `## [${version}]` || line.startsWith(`## [${version}] - `),
          );
          const end = lines.findIndex((line, index) => index > start && /^## /.test(line));
          const notes =
            start < 0
              ? ''
              : lines
                  .slice(start + 1, end < 0 ? undefined : end)
                  .join('\n')
                  .trim();
          prepare({
            directory: 'release-assets',
            version,
            commit: process.env.GITHUB_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            notes,
          });
          NODE
      - name: Publish the verified installers and feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '
            /^## / { heading=$2; gsub(/[][]/, "", heading); selected=(heading==version); next }
            selected { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then printf 'Faro %s\n' "$GITHUB_REF_NAME" > "$notes"; fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Faro $GITHUB_REF_NAME" --notes-file "$notes"
          fi
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f ! -name 'manifest-*' -print0)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --title "Faro $GITHUB_REF_NAME" --notes-file "$notes"
