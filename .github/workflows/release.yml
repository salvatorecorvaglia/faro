name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Extract Changelog Entry
        id: changelog
        shell: node {0}
        run: |
          const fs = require('fs');
          let version = (process.env.GITHUB_REF_NAME || '').replace(/^v/, '');
          if (!version || version === 'main' || version === 'master') {
            try {
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              version = pkg.version;
            } catch (e) {}
          }
          
          let body = '';
          if (fs.existsSync('CHANGELOG.md')) {
            const content = fs.readFileSync('CHANGELOG.md', 'utf8');
            const cleanVersion = version.replace(/^v/, '');
            const lines = content.split(/\r?\n/);
            let capturing = false;
            let resultLines = [];
            
            for (const line of lines) {
              if (line.startsWith('## ')) {
                if (capturing) {
                  break;
                }
                const headerText = line.substring(3).trim();
                if (headerText.includes('[' + cleanVersion + ']') || headerText.includes('[v' + cleanVersion + ']') || headerText.includes(cleanVersion)) {
                  capturing = true;
                }
              } else if (capturing) {
                resultLines.push(line);
              }
            }
            body = resultLines.join('\n').trim();
          }
          
          if (!body) {
            body = 'See the assets below to download Faro for your platform.';
          }
          
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `body<<EOF_CHANGELOG\n${body}\nEOF_CHANGELOG\n`);

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Faro v__VERSION__'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
