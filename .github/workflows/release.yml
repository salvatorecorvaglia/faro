name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=6144"
  CARGO_INCREMENTAL: "0"

jobs:
  validate:
    name: Validate Tag Ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate tag format and version match
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Release workflow must be run on a version tag ref starting with 'v' (e.g. refs/tags/v1.0.0)"
            exit 1
          fi
          
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(jq -r .version package.json)
          TAURI_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO_VERSION=$(grep -m 1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f 2)
          
          echo "Tag version: $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"
          echo "tauri.conf.json version: $TAURI_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          
          if [[ "$TAG_VERSION" != "$TAURI_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match tauri.conf.json version ($TAURI_VERSION)"
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match src-tauri/Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

  verify-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Find or start the CI run for this commit, then wait for it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          find_run_id() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml \
              --json databaseId,headSha,createdAt \
              --jq "[.[] | select(.headSha == \"$GITHUB_SHA\")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty"
          }

          echo "Looking for an existing CI run on $GITHUB_SHA..."
          RUN_ID="$(find_run_id)"

          if [ -z "$RUN_ID" ]; then
            echo "None found. Dispatching ci.yml against $GITHUB_REF_NAME..."
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

            for _ in $(seq 1 20); do
              sleep 10
              RUN_ID="$(find_run_id)"
              [ -n "$RUN_ID" ] && break
            done

            if [ -z "$RUN_ID" ]; then
              echo "::error::Could not find or start a CI run for $GITHUB_SHA."
              exit 1
            fi
          fi

          echo "Waiting on CI run $RUN_ID..."
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

  publish-tauri:
    name: Release (${{ matrix.platform }})
    permissions:
      contents: write
    needs: [validate, verify-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-15'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-15'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: ''
            args: ''
          - platform: 'windows-latest'
            target: ''
            args: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev sqlite3

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable updater if signing key is missing
        if: ${{ !env.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY is not set. Disabling updater."
          jq '.bundle.createUpdaterArtifacts = false | del(.plugins.updater)' src-tauri/tauri.conf.json > temp.json && mv temp.json src-tauri/tauri.conf.json

      - name: Build and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Faro v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  finalize:
    name: Finalize Release
    runs-on: ubuntu-latest
    needs: publish-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Release Notes
        id: extract_notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(sed -e "1,/## \[$VERSION\]/d" -e '/## \[/,$d' CHANGELOG.md 2>/dev/null || true)
          fi
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Faro release $TAG"
          fi
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "notes<<$DELIM"
            echo "$NOTES"
            echo "$DELIM"
          } >> $GITHUB_OUTPUT

      - name: Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.extract_notes.outputs.notes }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          gh release edit "$TAG" \
            --draft=false \
            --title "Faro v$VERSION" \
            --notes "$RELEASE_NOTES" \
            --repo "$GITHUB_REPOSITORY"
