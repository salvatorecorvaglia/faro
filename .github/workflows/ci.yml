name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Lint, Typecheck & Test)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate version consistency
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          TAURI_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO_VERSION=$(grep -m 1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f 2)
          if [ "$PKG_VERSION" != "$TAURI_VERSION" ] || [ "$PKG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch: package.json is $PKG_VERSION, src-tauri/tauri.conf.json is $TAURI_VERSION, Cargo.toml is $CARGO_VERSION"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert a single CodeMirror view
        run: |
          found=$(pnpm ls @codemirror/view --depth=Infinity \
            | grep -oE '@codemirror/view@[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          count=$(printf '%s\n' "$found" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one @codemirror/view, found $count:"
            printf '%s\n' "$found"
            echo "Align package.json with the override in pnpm-workspace.yaml."
            exit 1
          fi
          echo "Single CodeMirror view: $found"

      - name: Biome Lint
        run: pnpm lint

      - name: Vitest Unit Tests
        run: pnpm test:coverage

      - name: Frontend Build
        run: pnpm build

  rust-lint:
    name: Rust (Fmt & Clippy)
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g; s|https://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' "$source"
            fi
          done
          options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${options[@]}" update
          sudo apt-get "${options[@]}" install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: v1-ci-artifacts

      - name: Cargo Manifest And Lock Agree
        run: cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null

      - name: Cargo Format Check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-deps -- -D warnings

  rust-test:
    name: Rust Integration Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g; s|https://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' "$source"
            fi
          done
          options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${options[@]}" update
          sudo apt-get "${options[@]}" install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev sqlite3

      - name: Start Test Database Services
        id: databases
        run: docker compose -f tests/docker-compose.test.yml up -d --wait --wait-timeout 300

      - name: Diagnose Database Startup Failure
        if: ${{ failure() && steps.databases.outcome == 'failure' }}
        run: |
          uname -a
          docker compose -f tests/docker-compose.test.yml ps -a
          docker compose -f tests/docker-compose.test.yml logs --no-color --tail=200

      - name: Seed Test Databases
        run: ./scripts/seed.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: v1-ci-artifacts

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Run Rust Integration Tests
        env:
          FARO_REQUIRE_LIVE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify Rust cache inputs and compiled artifacts
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --all-features --format-version 1 --manifest-path src-tauri/Cargo.toml > "$RUNNER_TEMP/cargo-metadata.json"
          du -sh src-tauri/target | tee -a "$GITHUB_STEP_SUMMARY"
          test -n "$(find src-tauri/target -name '*.rlib' -print -quit)"

  rust-unit:
    name: Rust Unit Tests (${{ matrix.os }})
    env:
      RUSTC_WRAPPER: ${{ !startsWith(matrix.os, 'windows') && 'sccache' || '' }}
      SCCACHE_GHA_ENABLED: ${{ !startsWith(matrix.os, 'windows') && 'true' || 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: v1-ci-artifacts

      - name: Setup sccache
        if: ${{ !startsWith(matrix.os, 'windows') }}
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cargo Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Verify Rust cache inputs and compiled artifacts
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --all-features --format-version 1 --manifest-path src-tauri/Cargo.toml > "$RUNNER_TEMP/cargo-metadata.json"
          du -sh src-tauri/target | tee -a "$GITHUB_STEP_SUMMARY"
          test -n "$(find src-tauri/target -name '*.rlib' -print -quit)"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm Audit
        run: pnpm audit --audit-level high

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Cargo Audit
        run: cargo audit --file src-tauri/Cargo.lock

  package-smoke:
    name: Installer smoke (${{ matrix.platform }}, ${{ matrix.target }})
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      RUSTC_WRAPPER: ${{ !startsWith(matrix.platform, 'windows') && 'sccache' || '' }}
      SCCACHE_GHA_ENABLED: ${{ !startsWith(matrix.platform, 'windows') && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-15"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
            updater-platform: darwin-aarch64
          - platform: "macos-15"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
            updater-platform: darwin-x86_64
          - platform: "ubuntu-22.04"
            target: ""
            args: ""
            updater-platform: linux-x86_64
          - platform: "windows-latest"
            target: ""
            args: ""
            updater-platform: windows-x86_64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: v2-release-artifacts
          key: release-${{ matrix.target || matrix.platform }}

      - name: Setup sccache
        if: ${{ !startsWith(matrix.platform, 'windows') }}
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Linux dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g; s|https://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' "$source"
            fi
          done
          options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${options[@]}" update
          sudo apt-get "${options[@]}" install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev sqlite3

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure installer signing
        shell: bash
        env:
          RELEASE_BUILD: ${{ inputs.release || false }}
        run: |
          if [[ "$RELEASE_BUILD" == true && "$GITHUB_REF" != refs/tags/v* ]]; then
            echo 'Release installers require a version tag' >&2
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            node -e 'const fs = require("node:fs"); const path = "src-tauri/tauri.conf.json"; const config = JSON.parse(fs.readFileSync(path)); config.bundle.createUpdaterArtifacts = false; delete config.plugins.updater; fs.writeFileSync(path, JSON.stringify(config, null, 2));'
          fi
      - name: Build installers once without publishing
        id: installers
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
      - name: Stage and checksum the installers
        env:
          ARTIFACT_PATHS: ${{ steps.installers.outputs.artifactPaths }}
          APP_VERSION: ${{ steps.installers.outputs.appVersion }}
          UPDATER_PLATFORM: ${{ matrix.updater-platform }}
          UPDATER_SIGNED: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { copyFileSync, existsSync, mkdirSync, readFileSync, statSync, writeFileSync } from 'node:fs';
          import { basename, join } from 'node:path';
          const platforms = ['darwin-aarch64', 'darwin-x86_64', 'linux-x86_64', 'windows-x86_64'];
          const sha256 = (path) => createHash('sha256').update(readFileSync(path)).digest('hex');
          const safeName = (name) =>
            typeof name === 'string' &&
            basename(name) === name &&
            !/[\\/]/.test(name) &&
            !['.', '..'].includes(name);
          const updaterFile = (platform, files) => {
            const suffixes = platform.startsWith('darwin')
              ? ['.app.tar.gz']
              : platform.startsWith('linux')
                ? ['.AppImage', '.AppImage.tar.gz']
                : ['.msi.zip', '.msi', '.nsis.zip', '.exe'];
            return suffixes.map((suffix) => files.find((file) => file.name.endsWith(suffix))).find(Boolean);
          };

          function stage({ paths, platform, version, commit, signed, output }) {
            if (!platforms.includes(platform) || !/^[a-f0-9]{40}$/.test(commit))
              throw new Error('Invalid build identity');
            mkdirSync(output, { recursive: true });
            const sources = new Set(
              paths.flatMap((path) => (existsSync(`${path}.sig`) ? [path, `${path}.sig`] : [path])),
            );
            const files = [];
            for (const source of sources) {
              if (!statSync(source).isFile()) continue;
              let name = basename(source);
              if (name.includes('.app.tar.gz')) {
                const arch = platform === 'darwin-aarch64' ? 'aarch64' : 'x86_64';
                name = name.replace('.app.tar.gz', `_${arch}.app.tar.gz`);
              }
              if (!safeName(name) || files.some((file) => file.name === name))
                throw new Error(`Duplicate or unsafe asset: ${name}`);
              copyFileSync(source, join(output, name));
              files.push({ name, sha256: sha256(join(output, name)) });
            }
            if (!files.length) throw new Error('No installer artifacts produced');
            const manifest = { platform, version, commit, signed, files };
            if (signed) {
              const updater = updaterFile(platform, files);
              if (!updater || !files.some((file) => file.name === `${updater.name}.sig`))
                throw new Error(`Missing signed updater for ${platform}`);
            }
            writeFileSync(
              join(output, `manifest-${platform}.json`),
              `${JSON.stringify(manifest, null, 2)}\n`,
            );
            return manifest;
          }

          stage({ paths: JSON.parse(process.env.ARTIFACT_PATHS), platform: process.env.UPDATER_PLATFORM, output: 'release-assets', version: process.env.APP_VERSION, commit: process.env.GITHUB_SHA, signed: process.env.UPDATER_SIGNED === 'true' });
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: tauri-${{ matrix.updater-platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
      - name: Verify Rust cache inputs and compiled artifacts
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --all-features --format-version 1 --manifest-path src-tauri/Cargo.toml > "$RUNNER_TEMP/cargo-metadata.json"
          du -sh src-tauri/target | tee -a "$GITHUB_STEP_SUMMARY"
          test -n "$(find src-tauri/target -name '*.rlib' -print -quit)"
