name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # No path filter here: release.yml dispatches this explicitly for a tagged
  # commit that has no CI run yet, and a path-filtered trigger can silently
  # decline to run on a ref with no changed files to compare against.
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (Lint, Typecheck & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome Lint
        run: pnpm lint

      - name: TypeScript Check
        run: pnpm typecheck

      - name: Vitest Unit Tests
        run: pnpm test:coverage

  rust-lint:
    name: Rust (Fmt & Clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/*
          sudo apt-get -o Acquire::Http::Timeout="10" -o Acquire::Retries="3" update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cargo Format Check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-deps -- -D warnings

  rust-test:
    name: Rust Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/*
          sudo apt-get -o Acquire::Http::Timeout="10" -o Acquire::Retries="3" update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev sqlite3

      - name: Start Test Database Services
        run: docker compose -f tests/docker-compose.test.yml up -d

      - name: Seed Test Databases
        run: ./scripts/seed.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Run Rust Integration Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

