[package]
name = "faro"
version = "1.3.0"
description = "Fast, clean, cross-platform database client"
edition = "2021"
# SQLx 0.9 requires Rust 1.94; keep the declared floor aligned with dependencies.
rust-version = "1.94"

[lib]
name = "faro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = [] }
tauri-plugin-dialog = "2.8.3"
# Faro publishes v2 updater artifacts. The optional `zip` feature only supports
# legacy v1 bundles and pulls in zip 4, which has unpatched advisories.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2.4.0"

# `rc` lets a command return an `Arc` it also keeps in the result cache, so
# caching a result costs no second copy of its rows.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1.0.154"
thiserror = "2"

tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7.20"
async-trait = "0.1"
futures = "0.3"

# sqlx handles the network SQL engines; rusqlite bundles SQLite for local files.
# The mysql driver also serves MariaDB.
# Direct engine crates avoid resolving SQLx's optional SQLite native library.
sqlx-core = {version = "0.9", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "chrono", "uuid", "bigdecimal", "json"]}
sqlx-postgres = {version = "0.9", default-features = false, features = ["chrono", "uuid", "bigdecimal", "json"]}
sqlx-mysql = {version = "0.9", default-features = false, features = ["chrono", "uuid", "bigdecimal", "json"]}

# SQLite sessions and the settings store share rusqlite and one native SQLite library.
rusqlite = { version = "0.43.0", features = ["bundled", "column_decltype"] }
# The default "v1" feature pulls in the native store for each platform:
# Keychain on macOS, Credential Manager on Windows, Secret Service on Linux.
keyring = "4"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
# Arbitrary-precision decimals. Version tracks sqlx's, so the `BigDecimal`
# decoded out of a row is the same type this crate names.
bigdecimal = "0.4.11"
dirs = "7.0.0"
# `bundled` compiles DuckDB in; there is no system libduckdb to link against on
# a typical machine. It is the reason this crate is behind a feature.
duckdb = { version = "1.20000.2", features = ["bundled"], optional = true }

# MongoDB. `bson` is re-exported by the driver but named explicitly because the
# query parser converts JSON into BSON directly.
# `bson-3` picks the BSON major version and must match the `bson` dependency
# below exactly, or `bson::Document`/`Bson` values built here won't type-check
# against the mongodb crate's own API. `compat-3-3-0` is the crate's
# forward-compatibility opt-in; it refuses to build without both.
mongodb = { version = "3.10.1", default-features = false, features = ["rustls-tls", "bson-3", "compat-3-3-0"] }
bson = { version = "3.1.0", features = ["serde", "serde_json-1"] }

# ClickHouse speaks HTTP. The `clickhouse` crate maps rows onto serde structs,
# which cannot express the arbitrary result shapes a SQL client needs, so Faro
# talks to the HTTP interface directly.
# reqwest 0.13 calls the rustls feature "rustls", not "rustls-tls"; `query` is
# what allows the ClickHouse settings to be passed as URL parameters.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query"] }

# SQL Server. tiberius is not sqlx: it has no pool of its own and needs a
# tokio-util compat layer over the socket, so bb8 supplies the pooling.
tiberius = { version = "0.13.0", default-features = false, features = ["native-tls", "tds73", "chrono"] }
bb8 = "0.9"
# The local bb8 manager uses the same Tiberius version as the driver.

zip = { version = "9.6.1", default-features = false }
tempfile = "3"
csv = "1.4"
# Spreadsheet write and read. Pinned to current majors — older releases are
# what Cargo's MSRV-aware resolver picks if rust-version is left too low.
rust_xlsxwriter = "0.102.0"
calamine = "0.38.0"

[features]
desktop-smoke = []
# DuckDB is on by default so shipped builds include it, but it compiles a large
# bundled C++ amalgamation. `--no-default-features` skips it for a fast
# iteration loop.
default = ["duckdb-engine"]
duckdb-engine = ["duckdb"]

# Tauri's custom-protocol is enabled by the CLI for production builds.
custom-protocol = ["tauri/custom-protocol"]
duckdb = ["dep:duckdb"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
