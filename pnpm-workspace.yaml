# esbuild ships prebuilt binaries and needs its install script to pick the one
# for this platform. Vite will not start without it.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@codemirror/view@6.43.15"
  - "@codemirror/state@6.7.6"
  - "@rolldown/binding-darwin-x64@1.2.5"
  - "@rolldown/binding-linux-arm64-gnu@1.2.5"
  - "@vitejs/plugin-react@6.1.0"
  - vite@8.2.2 || 8.3.1 || 8.3.5
  - "@types/node@26.4.0 || 26.5.0"
  - "@tanstack/react-virtual@3.14.11 || 3.14.20 || 3.14.22"
  - "@tanstack/virtual-core@3.17.9 || 3.19.5 || 3.19.7"
  - jsdom@30.1.3
  - "@vitest/mocker@5.0.5"
  - "@vitest/spy@5.0.5"
  - vitest@5.0.5
  - "@vitest/coverage-v8@5.0.5"
  - react-resizable-panels@4.14.6 || 4.14.8
  - '@biomejs/biome@2.6.4'
  - '@biomejs/cli-android-arm64@2.6.4'
  - '@biomejs/cli-android-x64@2.6.4'
  - '@biomejs/cli-darwin-arm64@2.6.4'
  - '@biomejs/cli-darwin-x64@2.6.4'
  - '@biomejs/cli-linux-arm64-musl@2.6.4'
  - '@biomejs/cli-linux-arm64@2.6.4'
  - '@biomejs/cli-linux-x64-musl@2.6.4'
  - '@biomejs/cli-linux-x64@2.6.4'
  - '@biomejs/cli-win32-arm64@2.6.4'
  - '@biomejs/cli-win32-x64@2.6.4'

# CodeMirror breaks if two copies of @codemirror/view load: the packages
# exchange class instances, and duplicate module identities fail instanceof
# checks at runtime. Forcing one version keeps the editor working, not just the
# types happy.
overrides:
  "@codemirror/view": 6.43.15
  "@codemirror/state": 6.7.6
